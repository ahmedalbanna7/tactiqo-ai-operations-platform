global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tactiqo-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/tactiqo-metrics/metrics-token
    static_configs:
      - targets: ["api:8000"]

  - job_name: tactiqo-worker
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/tactiqo-metrics/metrics-token
    static_configs:
      - targets: ["worker:8101"]
