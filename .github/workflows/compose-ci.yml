name: Compose CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local-only test configuration
        run: cp .env.example .env

      - name: Validate Compose model
        run: docker compose --env-file .env config --quiet
