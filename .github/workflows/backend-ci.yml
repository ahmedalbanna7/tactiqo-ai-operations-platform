name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups --extra infrastructure

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Strict type check
        run: uv run mypy backend/src apps/api/src apps/worker/src apps/mcp_demo/src

      - name: Tests
        run: uv run pytest

      - name: Verify migration graph
        run: uv run alembic heads

  prometheus-rules:
    name: Prometheus alert-rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test alert behavior with promtool
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "${{ github.workspace }}/infra/otel:/etc/prometheus:ro"
          prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
          test rules /etc/prometheus/alerts.test.yml

      - name: Check alert-rule syntax
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "${{ github.workspace }}/infra/otel:/etc/prometheus:ro"
          prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
          check rules /etc/prometheus/alerts.yml
