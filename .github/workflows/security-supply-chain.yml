name: Security and Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Export locked dependency graph
        run: uv export --frozen --all-extras --all-groups --no-emit-project --output-file requirements-audit.txt

      - name: Audit Python vulnerabilities
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          --requirement requirements-audit.txt
          --no-deps
          --disable-pip

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production vulnerabilities
        run: pnpm audit --prod --audit-level high

  sbom-and-licenses:
    name: SBOM and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Enforce dependency license policy
        run: python scripts/check_dependency_licenses.py sbom.spdx.json

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: tactiqo-spdx-sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  architecture-policy:
    name: Architecture change policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require ADR for material architecture changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_architecture_change.py
