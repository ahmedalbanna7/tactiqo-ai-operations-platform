name: tactiqo

services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tactiqo}
      POSTGRES_USER: ${POSTGRES_USER:-tactiqo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${TACTIQO_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [core]

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${TACTIQO_REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [core]

  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine@sha256:6a77282b9ac7dcc50566459702b905d67e66c24ad54bf05b47529af031cdc7ff
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tactiqo_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "127.0.0.1:${TACTIQO_RABBITMQ_HOST_PORT:-15673}:5672"
      - "127.0.0.1:${TACTIQO_RABBITMQ_MANAGEMENT_HOST_PORT:-25673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [core]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${TACTIQO_MINIO_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${TACTIQO_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [core]

  mcp-demo:
    build:
      context: .
      dockerfile: apps/mcp_demo/Dockerfile
    expose: ["8100"]
    restart: unless-stopped
    networks: [core]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      TACTIQO_ENVIRONMENT: ${TACTIQO_ENVIRONMENT:-local}
      TACTIQO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tactiqo_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-tactiqo}
      TACTIQO_REDIS_URL: redis://redis:6379/0
      TACTIQO_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-tactiqo_app}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
      TACTIQO_MINIO_ENDPOINT: http://minio:9000
      TACTIQO_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me}
      TACTIQO_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [core]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TACTIQO_APP_NAME: ${TACTIQO_APP_NAME:-Tactiqo AI Operations Platform}
      TACTIQO_APP_VERSION: ${TACTIQO_APP_VERSION:-0.1.0}
      TACTIQO_ENVIRONMENT: ${TACTIQO_ENVIRONMENT:-local}
      TACTIQO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tactiqo_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-tactiqo}
      TACTIQO_REDIS_URL: redis://redis:6379/0
      TACTIQO_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-tactiqo_app}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
      TACTIQO_MINIO_ENDPOINT: http://minio:9000
      TACTIQO_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me}
      TACTIQO_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      TACTIQO_MINIO_BUCKET: ${TACTIQO_MINIO_BUCKET:-tactiqo-knowledge}
      TACTIQO_MODEL_PROVIDER: ${TACTIQO_MODEL_PROVIDER:-deterministic}
      TACTIQO_OPENAI_API_KEY: ${TACTIQO_OPENAI_API_KEY:-}
      TACTIQO_OPENAI_MODEL: ${TACTIQO_OPENAI_MODEL:-gpt-5.6-sol}
      TACTIQO_OPENAI_REASONING_EFFORT: ${TACTIQO_OPENAI_REASONING_EFFORT:-low}
      TACTIQO_MCP_ENABLED: ${TACTIQO_MCP_ENABLED:-true}
      TACTIQO_MCP_DEMO_URL: http://mcp-demo:8100/mcp
      TACTIQO_KNOWLEDGE_SEARCH_ENABLED: ${TACTIQO_KNOWLEDGE_SEARCH_ENABLED:-false}
      TACTIQO_ONYX_BASE_URL: ${TACTIQO_ONYX_BASE_URL:-http://localhost:8080}
      TACTIQO_ONYX_SERVICE_TOKEN: ${TACTIQO_ONYX_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:${TACTIQO_API_HOST_PORT:-18000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      mcp-demo: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [core]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      TACTIQO_ENVIRONMENT: ${TACTIQO_ENVIRONMENT:-local}
      TACTIQO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tactiqo_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-tactiqo}
      TACTIQO_REDIS_URL: redis://redis:6379/0
      TACTIQO_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-tactiqo_app}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
      TACTIQO_MINIO_ENDPOINT: http://minio:9000
      TACTIQO_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me}
      TACTIQO_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      TACTIQO_MINIO_BUCKET: ${TACTIQO_MINIO_BUCKET:-tactiqo-knowledge}
      TACTIQO_KNOWLEDGE_SEARCH_ENABLED: ${TACTIQO_KNOWLEDGE_SEARCH_ENABLED:-false}
      TACTIQO_ONYX_BASE_URL: ${TACTIQO_ONYX_BASE_URL:-http://localhost:8080}
      TACTIQO_ONYX_SERVICE_TOKEN: ${TACTIQO_ONYX_SERVICE_TOKEN:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [core]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000}
    ports:
      - "127.0.0.1:${TACTIQO_WEB_HOST_PORT:-13000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [core]

networks:
  core:
    name: tactiqo-core

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
